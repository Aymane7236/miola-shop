spring.application.name=miola-shop-backend
server.port=8080

# H2 base de donnees — mode memoire avec data.sql
spring.datasource.url=jdbc:h2:mem:testbd
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialisation SQL apres la creation du schema Hibernate
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Spring Data REST
spring.data.rest.base-path=/api

# Groq API (cloud, remplace Ollama)
groq.api-url=https://api.groq.com/openai/v1/chat/completions
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.1-8b-instant}

# Spring Security
spring.security.user.name=admin
spring.security.user.password=admin123

# Actuator pour healthcheck Docker
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
