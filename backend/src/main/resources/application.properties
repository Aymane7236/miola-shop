spring.application.name=miola-shop-backend
server.port=8080

# Profil actif : h2 pour Docker Compose, mysql pour Kubernetes
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# Spring Data REST
spring.data.rest.base-path=/api

# Groq API (cloud, remplace Ollama)
groq.api-url=https://api.groq.com/openai/v1/chat/completions
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.1-8b-instant}

# Spring Security
spring.security.user.name=admin
spring.security.user.password=admin123

# Actuator pour healthcheck Docker / Kubernetes
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
