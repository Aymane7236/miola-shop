server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy les requetes API chat vers le backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Proxy les requetes CRUD voitures vers le backend
    location /voitures {
        proxy_pass http://backend:8080/voitures;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy Spring Data REST (si utilise)
    location /data/ {
        proxy_pass http://backend:8080/data/;
        proxy_set_header Host $host;
    }

    # Fallback SPA : toutes les routes non-fichiers → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
